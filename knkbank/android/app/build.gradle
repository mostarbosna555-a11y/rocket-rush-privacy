plugins {
    id 'com.android.application'
}

// The web app (knkbank/index.html) is the single source of truth; copy it into the APK assets.
def webAssets = layout.buildDirectory.dir('webassets')
tasks.register('copyWebApp', Copy) {
    from('../../index.html')
    into(webAssets)
}
preBuild.dependsOn('copyWebApp')

android {
    namespace 'com.knkbank.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.knkbank.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main.assets.srcDirs += webAssets
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly (sideload, not Play Store).
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
