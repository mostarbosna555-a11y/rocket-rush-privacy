<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klinik Yönetim</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="login" class="login-wrap hidden">
  <form id="loginForm" class="login-card">
    <h1>Klinik Yönetim</h1>
    <p class="muted">Devam etmek için giriş yapın</p>
    <label>Kullanıcı Adı<input name="username" autocomplete="username" required></label>
    <label>Şifre<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary block" type="submit">Giriş Yap</button>
    <div id="loginError" class="error"></div>
  </form>
</div>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">Klinik<span>Yönetim</span></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="balanceBox" class="balance"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div id="crumb" class="crumb"></div>
      <div class="topbar-right">
        <span id="whoami" class="who"></span>
        <button class="btn ghost sm" id="logoutBtn">Çıkış</button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <header><h3 id="modalTitle"></h3><button class="x" data-close>&times;</button></header>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
